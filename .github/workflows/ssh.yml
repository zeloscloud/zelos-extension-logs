name: SSH

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boards:
    name: Docker boards over ssh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: just ci-install

      # Builds and runs three boards (systemd 255, systemd 247, BusyBox with Dropbear) and removes them.
      - name: Read logs from the boards
        run: uv run pytest -m ssh tests/ssh

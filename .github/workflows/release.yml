name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every OS, and the SSH boards, must be green before anything is packaged.
  ci:
    name: CI
    uses: ./.github/workflows/CI.yml

  ssh:
    name: SSH boards
    uses: ./.github/workflows/ssh.yml

  release:
    name: Release
    needs: [ci, ssh]
    runs-on: ubuntu-latest
    # The one job that writes: it creates the GitHub release.
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: extractions/setup-just@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Plain `python`, not `uv run python`: reading two TOML files must not sync the project first.
      - name: Verify version matches manifest files
        run: |
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"

          EXTENSION_VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('extension.toml').read_text())['version'])")
          if [ "$EXTENSION_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: extension.toml version ($EXTENSION_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✓ extension.toml version matches: $EXTENSION_VERSION"

          PYPROJECT_VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: pyproject.toml version ($PYPROJECT_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✓ pyproject.toml version matches: $PYPROJECT_VERSION"

      - name: Install Zelos CLI
        run: |
          curl -fsSL https://release.zeloscloud.io/cli/install.sh | bash
          echo "$HOME/.zelos/bin" >> "$GITHUB_PATH"
        env:
          INSTALLER_NO_MODIFY_PATH: 1

      - name: Install dependencies
        run: just ci-install

      - name: Package extension
        run: just package

      # `zelos extensions package` names the archive after the manifest name slug: logs-<version>.tar.gz.
      - name: Verify package was created
        run: |
          if ! ls ./*-"${{ steps.version.outputs.VERSION }}".tar.gz 1> /dev/null 2>&1; then
            echo "Error: Package file not found: *-${{ steps.version.outputs.VERSION }}.tar.gz"
            exit 1
          fi
          echo "✓ Package created: $(ls ./*-"${{ steps.version.outputs.VERSION }}".tar.gz)"

      # The packager only warns when the action dump fails, and then ships an empty or stale
      # actions.json. Without these actions in it, the Host list, Auto-configure, Test Connection,
      # Show Access Key and Convert Log File do nothing while the extension is stopped, and
      # nothing else in the pipeline notices.
      - name: Verify standalone action inventory shipped
        run: |
          ARCHIVE=$(ls ./*-"${{ steps.version.outputs.VERSION }}".tar.gz)
          if ! tar -xzOf "$ARCHIVE" actions.json | jq -e '[.actions[].path] | sort
              == ["auto_config", "convert_log_file", "list_hosts", "show_access_key", "test_connection"]' > /dev/null; then
            echo "Error: actions.json in $ARCHIVE does not list the five standalone actions"
            exit 1
          fi
          echo "✓ actions.json in $ARCHIVE lists the five standalone actions"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: "*-${{ steps.version.outputs.VERSION }}.tar.gz"
          generate_release_notes: true
          fail_on_unmatched_files: true

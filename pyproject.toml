[project]
name = "zelos-extension-logs"
version = "0.1.0"
description = "Stream logs from Linux boards over SSH, and from files and commands, into Zelos."
authors = [{ name = "Zeloscloud", email = "info@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "logs", "journald", "syslog", "ssh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "zelos-sdk>=0.0.12,<0.1",
    "zelos-log-lines>=0.1,<0.2",
    "jsonschema>=4",
    # zoneinfo reads IANA zones from the system, and Windows has none.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-logs"
Repository = "https://github.com/zeloscloud/zelos-extension-logs"
Issues = "https://github.com/zeloscloud/zelos-extension-logs/issues"
Documentation = "https://docs.zeloscloud.io/latest/sdk/how-to/develop-extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6",
    "ruff>=0.16.10",
    "pyright>=1.1.400",
    "pyarrow>=14",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_logs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO -m 'not ssh and not perf'"
markers = [
    "ssh: against Docker boards over real SSH; run with -m ssh",
    "perf: throughput with zero loss; run with -m perf",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PTH"]

[tool.pyright]
include = ["main.py", "zelos_extension_logs", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[project]
name = "zelos-extension-logs"
version = "0.1.1"
description = "Record logs in Zelos on the same timeline as your data: a device's system log over SSH, this computer's system log, any log file, or any command's output. Convert saved logs to Zelos traces."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zelos", "extension", "logs", "journald", "syslog", "ssh", "macos", "windows"]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "zelos-log-lines>=0.1.3,<0.2",
    "jsonschema>=4",
    # zoneinfo reads IANA zones from the system, and Windows has none.
    "tzdata; sys_platform == 'win32'",
    # Windows' ProgramData folder, asked of Windows, for its OpenSSH.
    "platformdirs>=4; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-logs"
Repository = "https://github.com/zeloscloud/zelos-extension-logs"
Issues = "https://github.com/zeloscloud/zelos-extension-logs/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "hypothesis>=6",
    "pyright>=1.1.400",
    "pyarrow>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_logs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO -m 'not ssh and not perf'"
markers = [
    "ssh: against Docker boards over real SSH; run with -m ssh",
    "perf: throughput with zero loss; run with -m perf",
]

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]

[tool.pyright]
include = ["main.py", "zelos_extension_logs", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

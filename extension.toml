name = "Logs"
version = "0.1.1"
description = "Record logs in Zelos on the same timeline as your data: a device's system log over SSH, this computer's system log, any log file, or any command's output. Convert saved logs to Zelos traces."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-logs"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["journalctl", "systemd", "rsyslog", "embedded linux", "yocto", "buildroot", "raspberry pi", "busybox", "openwrt", "logread", "dmesg", "kernel", "logcat", "android", "docker", "macos", "windows", "remote", "device logs", "log viewer"]
categories = ["Embedded", "Diagnostics", "Monitoring", "IoT"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[agent.stop]
grace_seconds = 5

[package]
paths = ["LICENSE", "main.py", "zelos_extension_logs", "docs", "assets/readme"]
